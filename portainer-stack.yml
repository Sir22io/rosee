# Stack Portainer : image publiée par GitHub Actions, réglages via les variables de la stack.
services:
  rosee:
    image: ghcr.io/sir22io/rosee:latest
    container_name: rosee
    restart: unless-stopped
    ports:
      - "${ROSEE_PORT:-3000}:3000"   # port côté hôte, modifiable via la variable ROSEE_PORT
    environment:
      TZ: ${TZ:-Europe/Paris}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      FEED_BASE_URL: ${FEED_BASE_URL:-}
      PHOTO_LOOKUP: ${PHOTO_LOOKUP:-1}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      SEASONS: ${SEASONS:-north}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASS: ${BASIC_AUTH_PASS:-}
    volumes:
      # Volume nommé : il hérite des droits de l'image (utilisateur node), rien à préparer
      - rosee-data:/data

volumes:
  rosee-data:
