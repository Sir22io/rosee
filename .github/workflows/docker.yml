name: Image Docker

# À chaque push sur main :
#  0. lance les tests (npm test) : en cas d'échec, rien n'est publié ;
#  1. lit la version de package.json ;
#  2. si le tag vX.Y.Z n'existe pas encore, crée le tag et la release GitHub (notes générées) ;
#  3. construit l'image et la publie : latest, sha-xxxxxxx et, pour une nouvelle version, X.Y.Z et X.Y.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Les tests passent d'abord : si l'un échoue, aucune image ni release n'est publiée.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "$VERSION" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.info.outputs.version }},enable=${{ steps.info.outputs.new }}
            type=raw,value=${{ steps.info.outputs.minor }},enable=${{ steps.info.outputs.new }}
          labels: |
            org.opencontainers.image.version=${{ steps.info.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ROSEE_VERSION=${{ steps.info.outputs.version }}
            ROSEE_COMMIT=${{ github.sha }}
            ROSEE_BUILT=${{ steps.info.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La release n'est créée qu'une fois l'image publiée : une version annoncée est toujours téléchargeable.
      - name: Release GitHub
        if: steps.info.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.info.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "v${{ steps.info.outputs.version }}" \
            --generate-notes
